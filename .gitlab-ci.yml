stages:
  - test

# E2E Tests - Manual trigger
e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.1-jammy

  # Manual trigger only
  rules:
    - when: manual
      allow_failure: true

  variables:
    CI: "true"
    # Set BASE_URL when triggering pipeline (e.g., https://dev.beachrex.com)
    # BROWSER: "all" | "chromium" | "firefox" | "webkit"
    # DigitalOcean Spaces configuration (credentials come from GitLab CI/CD variables)
    DO_SPACES_BUCKET: "beachrex-tests"
    DO_SPACES_REGION: "fra1"

  before_script:
    - corepack enable
    - yarn install --frozen-lockfile

  script:
    - |
      if [ "$BROWSER" = "all" ] || [ -z "$BROWSER" ]; then
        yarn playwright test
      else
        yarn playwright test --project=$BROWSER
      fi

  after_script:
    # Debug: Check if credentials are available
    - echo "Checking AWS credentials..."
    - |
      if [ -z "$AWS_ACCESS_KEY_ID" ]; then
        echo "❌ AWS_ACCESS_KEY_ID is not set!"
      else
        echo "✅ AWS_ACCESS_KEY_ID is set (length: ${#AWS_ACCESS_KEY_ID})"
      fi
    - |
      if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
        echo "❌ AWS_SECRET_ACCESS_KEY is not set!"
      else
        echo "✅ AWS_SECRET_ACCESS_KEY is set (length: ${#AWS_SECRET_ACCESS_KEY})"
      fi
    # Always upload report, even if tests fail
    - yarn test:e2e:upload || true

  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
    reports:
      junit: test-results/junit.xml

  timeout: 30 minutes

