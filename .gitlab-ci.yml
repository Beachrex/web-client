stages:
  - test
  - deploy

# ───────────────────────── DEPLOY TO VPS ─────────────────────────
# Auto-deploys the Next.js frontend to the Hetzner VPS on push to dev/uat/main.
# The VPS docker-compose.vps.yml builds front_dev/front_uat/front_prod from
# /opt/beachrex/front/ using Dockerfile.prod (standalone build).
#
# Required GitLab CI/CD Variables (Settings → CI/CD → Variables):
#   VPS_HOST             — e.g. 2.28.76.142
#   VPS_USER             — beachrex
#   VPS_SSH_PRIVATE_KEY  — base64-encoded private SSH key for the VPS user
#
# .env.front.{dev,uat,prod} are stored ONLY on the server and are NOT synced
# from GitLab. The deploy reads NEXT_PUBLIC_* build args from the server's
# .env.front.* file. Update them directly on the VPS when needed.

.deploy-template: &deploy-template
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # 1. Sync frontend code to VPS (excluding .env — it stays on the server)
    - rsync -az --delete
        --exclude '.git' --exclude 'node_modules' --exclude '.next'
        --exclude 'test-results' --exclude 'playwright-report'
        --exclude '.env' --exclude '.env.local'
        ./ "$VPS_USER@$VPS_HOST:/opt/beachrex/front/"
    # 2. Build and start frontend container (reads .env.front.* from server)
    - ssh "$VPS_USER@$VPS_HOST" "
        set -euo pipefail
        cd /opt/beachrex/deploy
        export ENV_NAME=${ENV_NAME}
        export FRONT_SVC=front_${ENV_NAME}
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} build \${FRONT_SVC} \
          --build-arg NEXT_PUBLIC_API_ENDPOINT=\$(grep NEXT_PUBLIC_API_ENDPOINT /opt/beachrex/envs/.env.front.\${ENV_NAME} | cut -d= -f2) \
          --build-arg NEXT_PUBLIC_BASE_URL=\$(grep NEXT_PUBLIC_BASE_URL /opt/beachrex/envs/.env.front.\${ENV_NAME} | cut -d= -f2) \
          --build-arg NEXT_PUBLIC_CDN_TEASER=\$(grep NEXT_PUBLIC_CDN_TEASER /opt/beachrex/envs/.env.front.\${ENV_NAME} | cut -d= -f2) \
          --build-arg NEXT_PUBLIC_CDN_LARGE=\$(grep NEXT_PUBLIC_CDN_LARGE /opt/beachrex/envs/.env.front.\${ENV_NAME} | cut -d= -f2) \
          --build-arg NEXT_PUBLIC_CDN_ASSETS=\$(grep NEXT_PUBLIC_CDN_ASSETS /opt/beachrex/envs/.env.front.\${ENV_NAME} | cut -d= -f2)
        docker compose --env-file /opt/beachrex/envs/.env.\${ENV_NAME} up -d --force-recreate \${FRONT_SVC}
        echo 'Frontend deploy of '\${ENV_NAME}' complete.'
      "

deploy:dev:
  <<: *deploy-template
  variables:
    ENV_NAME: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy:uat:
  <<: *deploy-template
  variables:
    ENV_NAME: uat
  rules:
    - if: $CI_COMMIT_BRANCH == "uat"

deploy:prod:
  <<: *deploy-template
  variables:
    ENV_NAME: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

# E2E Tests - API trigger only
e2e-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.56.1-jammy

  # Only run when triggered via API, not on push/merge
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: on_success
    - when: never

  variables:
    CI: "true"
    # Base URL for testing - override when triggering pipeline if needed
    # If not set, tests will try to start local dev server (slower)
    BASE_URL: "https://dev.beachrex.com"
    # BROWSER: "all" | "chromium" | "firefox" | "webkit"
    # TEST_FILTER: Optional - filter tests by file path or grep pattern
    # Examples:
    #   TEST_FILTER: "tests/home.spec.ts"           - Run specific file
    #   TEST_FILTER: "tests/auth/"                  - Run all tests in folder
    #   TEST_FILTER: "-g 'login'"                   - Run tests matching "login"
    #   TEST_FILTER: "tests/home.spec.ts -g 'hero'" - Specific file + grep
    # DigitalOcean Spaces configuration
    DO_SPACES_BUCKET: "beachrex-tests"
    DO_SPACES_REGION: "fra1"
    # These will be inherited from GitLab CI/CD Settings > Variables
    # AWS_ACCESS_KEY_ID: (set in GitLab CI/CD variables)
    # AWS_SECRET_ACCESS_KEY: (set in GitLab CI/CD variables)

  before_script:
    - corepack enable
    - yarn install --frozen-lockfile

  script:
    - |
      # Build the test command
      TEST_CMD="yarn playwright test"

      # Add browser filter if specified
      if [ -n "$BROWSER" ] && [ "$BROWSER" != "all" ]; then
        TEST_CMD="$TEST_CMD --project=$BROWSER"
      fi

      # Add test filter if specified
      if [ -n "$TEST_FILTER" ]; then
        TEST_CMD="$TEST_CMD $TEST_FILTER"
      fi

      echo "Running: $TEST_CMD"
      eval $TEST_CMD

  after_script:
    # Debug: Check if credentials are available
    - echo "Checking AWS credentials..."
    - |
      if [ -z "$AWS_ACCESS_KEY_ID" ]; then
        echo "❌ AWS_ACCESS_KEY_ID is not set!"
      else
        echo "✅ AWS_ACCESS_KEY_ID is set (length: ${#AWS_ACCESS_KEY_ID})"
      fi
    - |
      if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
        echo "❌ AWS_SECRET_ACCESS_KEY is not set!"
      else
        echo "✅ AWS_SECRET_ACCESS_KEY is set (length: ${#AWS_SECRET_ACCESS_KEY})"
      fi
    # Always upload report, even if tests fail
    - yarn test:e2e:upload || true

  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 30 days
    reports:
      junit: test-results/junit.xml

  timeout: 30 minutes

