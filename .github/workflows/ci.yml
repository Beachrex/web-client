name: CI

# Checks for pull requests (deploy.yml only runs on pushes to dev/uat/main).
on:
  pull_request:
    branches: [dev, uat, main]

concurrency:
  group: ci-front-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: yarn lint

      # Pure unit specs (no page/browser fixtures): no browser install needed.
      # BASE_URL stops playwright.config from starting `yarn dev`.
      - name: Unit tests
        env:
          BASE_URL: http://localhost:9
        run: npx playwright test e2e/*.unit.spec.ts --project=chromium
