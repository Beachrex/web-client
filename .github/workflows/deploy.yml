name: Deploy to VPS

on:
  push:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "uat"
        type: choice
        options: [dev, uat, prod]

concurrency:
  group: deploy-front
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            case "${GITHUB_REF##*/}" in
              main) echo "name=prod" >> $GITHUB_OUTPUT ;;
              uat)  echo "name=uat"  >> $GITHUB_OUTPUT ;;
              dev)  echo "name=dev"  >> $GITHUB_OUTPUT ;;
              *)    echo "Unsupported branch" >&2; exit 1 ;;
            esac
          fi

      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync frontend code
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'test-results' --exclude 'playwright-report' \
            --exclude '.env' --exclude '.env.local' \
            ./ ${VPS_USER}@${VPS_HOST}:/opt/beachrex/front_${ENV_NAME}/

      - name: Build and switch frontend on VPS (zero downtime)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          # Blue/green switch (backend ADR 2026-10-29 "Zero-downtime deploys", runbook
          # Beachrex/backend docs/runbooks/zero-downtime-deploys.md). The script, the green service and the
          # nginx state include ship together in backend deploy/; until the backend deploy that synced
          # /opt/beachrex/deploy/ has them, fall back to the old in-place recreate (a few seconds of 502).
          ssh ${VPS_USER}@${VPS_HOST} "
            set -euo pipefail
            SCRIPT=/opt/beachrex/deploy/scripts/front-deploy.sh
            if [ -f \${SCRIPT} ]; then
              bash \${SCRIPT} ${ENV_NAME}
            else
              echo '::warning::deploy/scripts/front-deploy.sh is not on the server yet: in-place recreate (short 502).'
              cd /opt/beachrex/deploy
              ENV_FILE=/opt/beachrex/envs/.env.${ENV_NAME}
              FRONT_ENV_FILE=/opt/beachrex/envs/.env.front.${ENV_NAME}
              FRONT_SVC=front_${ENV_NAME}
              # Load BOTH backend and frontend env files so NEXT_PUBLIC_* vars
              # are available to compose for build.args substitution.
              docker compose -f docker-compose.vps.yml --env-file \${ENV_FILE} --env-file \${FRONT_ENV_FILE} build \${FRONT_SVC}
              docker compose -f docker-compose.vps.yml --env-file \${ENV_FILE} --env-file \${FRONT_ENV_FILE} up -d --force-recreate \${FRONT_SVC}
            fi
            echo 'Frontend deploy of ${ENV_NAME} complete.'
          "

      - name: Reload Nginx
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} "sudo systemctl reload nginx"
