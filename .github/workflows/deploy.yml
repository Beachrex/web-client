name: Deploy to VPS

on:
  push:
    branches: [dev, uat, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "uat"
        type: choice
        options: [dev, uat, prod]

concurrency:
  group: deploy-front-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            case "${GITHUB_REF##*/}" in
              main) echo "name=prod" >> $GITHUB_OUTPUT ;;
              uat)  echo "name=uat"  >> $GITHUB_OUTPUT ;;
              dev)  echo "name=dev"  >> $GITHUB_OUTPUT ;;
              *)    echo "Unsupported branch" >&2; exit 1 ;;
            esac
          fi

      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync frontend code
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'test-results' --exclude 'playwright-report' \
            --exclude '.env' --exclude '.env.local' \
            ./ ${VPS_USER}@${VPS_HOST}:/opt/beachrex/front/

      - name: Build and start frontend on VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} "
            set -euo pipefail
            cd /opt/beachrex/deploy
            ENV_FILE=/opt/beachrex/envs/.env.${ENV_NAME}
            FRONT_SVC=front_${ENV_NAME}
            docker compose -f docker-compose.vps.yml --env-file \${ENV_FILE} build \${FRONT_SVC} \
              --build-arg NEXT_PUBLIC_API_ENDPOINT=\$(grep NEXT_PUBLIC_API_ENDPOINT /opt/beachrex/envs/.env.front.${ENV_NAME} | cut -d= -f2) \
              --build-arg NEXT_PUBLIC_BASE_URL=\$(grep NEXT_PUBLIC_BASE_URL /opt/beachrex/envs/.env.front.${ENV_NAME} | cut -d= -f2) \
              --build-arg NEXT_PUBLIC_CDN_TEASER=\$(grep NEXT_PUBLIC_CDN_TEASER /opt/beachrex/envs/.env.front.${ENV_NAME} | cut -d= -f2) \
              --build-arg NEXT_PUBLIC_CDN_LARGE=\$(grep NEXT_PUBLIC_CDN_LARGE /opt/beachrex/envs/.env.front.${ENV_NAME} | cut -d= -f2) \
              --build-arg NEXT_PUBLIC_CDN_ASSETS=\$(grep NEXT_PUBLIC_CDN_ASSETS /opt/beachrex/envs/.env.front.${ENV_NAME} | cut -d= -f2)
            docker compose -f docker-compose.vps.yml --env-file \${ENV_FILE} up -d --force-recreate \${FRONT_SVC}
            echo 'Frontend deploy of ${ENV_NAME} complete.'
          "

      - name: Reload Nginx
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} "sudo systemctl reload nginx"
